# Exceptions de l'analyse des failles (.github/workflows/scan.yml).
#
# Seulement pour une faille sans effet sur l'image : composant absent, ou
# jamais exécuté. Chaque entrée porte sa justification (statement) et une date
# d'expiration (expired_at) : passé cette date, Trivy la signale de nouveau.
# Retirer les entrées devenues inutiles à la publication suivante (voir
# CONTRIBUTING.md, « Correctifs de sécurité »).

vulnerabilities:
